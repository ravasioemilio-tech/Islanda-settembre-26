<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303e">
<title>Islanda On The Road</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appFrame">

<div class="topbar">
  <div class="brand">
    <h1>🇮🇸 Islanda On The Road</h1>
    <div class="status offline" id="netStatus"><span class="dot"></span><span id="netStatusText">offline</span></div>
  </div>
  <div class="desktopbar">
    <div class="desktopnav">
      <button class="navbtn active" data-view="days"><span class="ic">🗺️</span>Giorni</button>
      <button class="navbtn" data-view="budget"><span class="ic">💶</span>Budget</button>
      <button class="navbtn" data-view="info"><span class="ic">🏠</span>Info</button>
    </div>
    <button class="btn primary desktop-add-btn" id="fabAddExpenseDesktop">＋ Aggiungi spesa</button>
  </div>
  <div class="daytabs" id="dayTabs"></div>
</div>

<div class="install-banner" id="installBanner">
  📲 Aggiungi questa app alla schermata Home per usarla anche offline: menu del browser → "Aggiungi a schermata Home".
</div>

<div id="view-days">
  <div class="day-meta" id="dayMeta"></div>
  <div class="daytimes" id="dayTimes"></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <div class="stops" id="stopsList"></div>
</div>

<div id="view-budget" style="display:none">
  <div class="section-title">Budget del viaggio</div>
  <div class="budget-summary" id="budgetSummary"></div>
  <div class="section-title">💰 Saldi tra i partecipanti</div>
  <div class="balances-box" id="balancesBox"></div>
  <div class="section-title">Spese registrate</div>
  <div class="expense-list" id="expenseList"></div>
</div>

<div id="view-info" style="display:none">
  <div class="section-title">Partecipanti al viaggio</div>
  <div class="participants-box" id="participantsBox"></div>
  <div class="section-title">Pernottamenti</div>
  <div class="info-list" id="pernottamentiList"></div>
  <div class="section-title">Dati e backup</div>
  <div class="export-bar">
    <button id="exportBtn">⬇️ Esporta spese e note (backup JSON)</button>
  </div>
</div>

</div><!-- /appFrame -->

<div class="bottomnav">
  <button class="navbtn active" data-view="days"><span class="ic">🗺️</span>Giorni</button>
  <button class="navbtn" data-view="budget"><span class="ic">💶</span>Budget</button>
  <button class="navbtn" data-view="info"><span class="ic">🏠</span>Info</button>
</div>

<button class="fab" id="fabAddExpense">＋ Spesa</button>

<div class="modal-backdrop" id="expenseModalBackdrop">
  <div class="modal">
    <h2>Nuova spesa</h2>
    <div class="field">
      <label>Tipo spesa</label>
      <div class="chip-row" id="expTypeChips"></div>
    </div>
    <div class="field">
      <label>Pagato da</label>
      <select id="expPaidBy"></select>
    </div>
    <div class="field">
      <label>Giorno</label>
      <select id="expDay"></select>
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="chip-row" id="expCategoryChips"></div>
    </div>
    <div class="field">
      <label>Importo (€)</label>
      <input type="number" inputmode="decimal" step="0.01" id="expAmount" placeholder="0.00">
    </div>
    <div class="field">
      <label>Nota (facoltativa)</label>
      <input type="text" id="expNote" placeholder="es. benzina N1 Hvolsvöllur">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="expCancel">Annulla</button>
      <button class="btn primary" id="expSave">Salva spesa</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
